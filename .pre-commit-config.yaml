repos:
  # Standard file cleanup hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  # Ruff linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4 # Match this roughly with your pyproject.toml version
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # Mypy type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]

  # Frontend: ESLint + Prettier (run on whole src/ when any frontend file is staged)
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        entry: bash -c 'cd frontend && pnpm exec eslint --fix src/'
        language: system
        files: ^frontend/src/.*\.(ts|js|svelte)$
        pass_filenames: false
      - id: prettier-frontend
        name: Prettier (frontend)
        entry: bash -c 'cd frontend && pnpm exec prettier --write src/'
        language: system
        files: ^frontend/src/.*\.(ts|js|svelte|css|html)$
        pass_filenames: false
