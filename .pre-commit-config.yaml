repos:
  # Standard file cleanup hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  # Backend: Ruff linter + formatter (run from backend/ so per-file-ignores resolve correctly)
  - repo: local
    hooks:
      - id: ruff-backend
        name: Ruff (backend)
        entry: bash -c 'cd backend && ruff check --fix archivetools/ server/ tests/'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format-backend
        name: Ruff format (backend)
        entry: bash -c 'cd backend && ruff format archivetools/ server/ tests/'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy-backend
        name: Mypy (backend)
        entry: bash -c 'cd backend && mypy archivetools/'
        language: system
        files: ^backend/archivetools/.*\.py$
        pass_filenames: false

  # Frontend: ESLint + Prettier (run on whole src/ when any frontend file is staged)
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        entry: bash -c 'cd frontend && pnpm exec eslint --fix src/'
        language: system
        files: ^frontend/src/.*\.(ts|js|svelte)$
        pass_filenames: false
      - id: prettier-frontend
        name: Prettier (frontend)
        entry: bash -c 'cd frontend && pnpm exec prettier --write src/'
        language: system
        files: ^frontend/src/.*\.(ts|js|svelte|css|html)$
        pass_filenames: false
