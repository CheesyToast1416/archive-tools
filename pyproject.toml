[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archivetools"
version = "0.2.0"
description = "Full-featured archive manager with CJK encoding support (ZIP, RAR, 7z, TAR)"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "rarfile",
    "cryptography",
    "pyzipper",
    "pycryptodomex",
    "py7zr",
    "charset-normalizer>=3.0",
    "send2trash",
]

[project.scripts]
archivetools = "archivetools.cli:main"

[project.gui-scripts]
archivetools-gui = "archivetools.gui.app:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
# N802: Qt requires camelCase for event-handler overrides (dragEnterEvent, dropEvent, etc.)
ignore = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "PySide6.*"
ignore_missing_imports = true

# Third-party libraries without stubs
[[tool.mypy.overrides]]
module = ["pyzipper", "rarfile", "py7zr", "charset_normalizer", "send2trash"]
ignore_missing_imports = true

# Test files: strict annotations are not required for tests
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# GUI layer: PySide6 stubs are incomplete; Signal, findChild, etc. produce many
# false positives that can't be fixed without custom stubs.
[[tool.mypy.overrides]]
module = "archivetools.gui.*"
ignore_errors = true
