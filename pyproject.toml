[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archivetools"
version = "0.2.0"
description = "Full-featured archive manager with encoding support (ZIP, RAR, 7z, TAR)"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "CheesyToast1416" }]
keywords = ["archive", "zip", "rar", "7z", "tar", "cjk", "encoding"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving",
]
requires-python = ">=3.12"
dependencies = [
    "rarfile",
    "cryptography",
    "pyzipper",
    "pycryptodomex",
    "py7zr",
    "charset-normalizer>=3.0",
    "send2trash",
    "keyring",
    "plyer",
]

[project.scripts]
archivetools = "archivetools.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "pyinstaller",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "TID"]
ignore = ["N802"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"archivetools.encoding.detect" = {msg = "GUI must use archivetools.operations.detect_archive_encoding instead of importing encoding.detect directly."}
"archivetools.encoding.candidates" = {msg = "GUI must use the operations layer; do not import encoding internals from GUI code."}

[tool.ruff.lint.per-file-ignores]
"archivetools/encoding/*.py" = ["TID251"]
"archivetools/formats/*.py" = ["TID251"]
"archivetools/operations/*.py" = ["TID251"]
"tests/*.py" = ["TID251"]
"server/*.py" = ["TID251"]
"server/**/*.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

# Third-party libraries without stubs
[[tool.mypy.overrides]]
module = ["pyzipper", "rarfile", "py7zr", "charset_normalizer", "send2trash", "keyring"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cryptography.*"]
ignore_missing_imports = true

# Test files: strict annotations are not required for tests
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Server layer: fastapi, uvicorn, pydantic, sse_starlette lack complete stubs
# in the pre-commit mypy environment.
[[tool.mypy.overrides]]
module = ["server.*", "fastapi.*", "uvicorn.*", "pydantic.*", "sse_starlette.*", "starlette.*"]
ignore_errors = true
ignore_missing_imports = true
