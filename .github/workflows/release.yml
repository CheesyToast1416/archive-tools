name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Sanity check: all three version files must agree ──────────────────────
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify version consistency
        shell: bash
        run: |
          PY=$(python3 -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          RUST=$(grep '^version' frontend/src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAURI=$(python3 -c "import json; print(json.load(open('frontend/src-tauri/tauri.conf.json'))['version'])")
          echo "pyproject=$PY  Cargo=$RUST  tauri.conf=$TAURI"
          [ "$PY" = "$RUST" ] && [ "$PY" = "$TAURI" ] || (echo "ERROR: Version mismatch!" && exit 1)

  # ── Per-platform builds ────────────────────────────────────────────────────
  build:
    needs: check-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            sidecar_src: dist/archivetools-server
            sidecar_dst: archivetools-server-x86_64-unknown-linux-gnu

          - os: macos-latest
            triple: aarch64-apple-darwin
            sidecar_src: dist/archivetools-server
            sidecar_dst: archivetools-server-aarch64-apple-darwin

          - os: macos-13
            triple: x86_64-apple-darwin
            sidecar_src: dist/archivetools-server
            sidecar_dst: archivetools-server-x86_64-apple-darwin

          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            sidecar_src: dist/archivetools-server.exe
            sidecar_dst: archivetools-server-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # ── Python sidecar ─────────────────────────────────────────────────────
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps + PyInstaller (no PySide6)
        shell: bash
        run: |
          pip install --no-deps -e .
          pip install \
            "fastapi>=0.111" "uvicorn[standard]>=0.29" "sse-starlette>=2.1" \
            rarfile cryptography pyzipper pycryptodomex py7zr \
            "charset-normalizer>=3.0" send2trash keyring plyer \
            pyinstaller

      - name: Build server binary
        run: pyinstaller server.spec

      - name: Stage sidecar binary
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp "${{ matrix.sidecar_src }}" "frontend/src-tauri/binaries/${{ matrix.sidecar_dst }}"
          chmod +x "frontend/src-tauri/binaries/${{ matrix.sidecar_dst }}" || true

      # ── Frontend (SvelteKit + Tauri) ────────────────────────────────────────
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libgtk-3-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
          save-if: ${{ runner.os != 'Windows' }}

      - name: Build Tauri app
        working-directory: frontend
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Collect updater metadata (bundle name + signature) ─────────────────
      # Produces update-meta/{platform}.json used by the release job to build
      # latest.json. Exits 0 silently when signing keys are absent (e.g. PRs).
      - name: Collect updater metadata
        shell: python
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          import json, os, sys
          from pathlib import Path

          triple = os.environ["TRIPLE"]
          base = Path("frontend/src-tauri/target/release/bundle")

          cfg = {
              "x86_64-unknown-linux-gnu": ("linux-x86_64",   base / "appimage", "*_amd64.AppImage"),
              "aarch64-apple-darwin":     ("darwin-aarch64", base / "macos",    "*.app.tar.gz"),
              "x86_64-apple-darwin":      ("darwin-x86_64",  base / "macos",    "*.app.tar.gz"),
              "x86_64-pc-windows-msvc":   ("windows-x86_64", base / "nsis",     "*-setup.exe"),
          }

          platform, bundle_dir, pattern = cfg[triple]
          bundles = sorted(p for p in bundle_dir.glob(pattern) if not str(p).endswith(".sig"))

          if not bundles:
              print(f"WARN: no update bundle at {bundle_dir}/{pattern} — signing keys may be absent")
              sys.exit(0)

          bundle = bundles[0]
          sig = Path(str(bundle) + ".sig")

          if not sig.exists():
              print(f"WARN: no .sig at {sig} — updater metadata skipped")
              sys.exit(0)

          Path("update-meta").mkdir(exist_ok=True)
          out = Path("update-meta") / f"{platform}.json"
          out.write_text(json.dumps({
              "platform":  platform,
              "bundle":    bundle.name,
              "signature": sig.read_text().strip(),
          }, indent=2))
          print(f"Wrote {out}: {bundle.name}")

      # ── Upload installable bundles + updater metadata ──────────────────────
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: archivetools-${{ matrix.triple }}
          if-no-files-found: warn
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            update-meta/*.json

  # ── Publish GitHub release (tag pushes only) ──────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Reads the per-platform *.json metadata files produced by each build job
      # and assembles latest.json in the format the Tauri updater expects:
      # { version, notes, pub_date, platforms: { "<os>-<arch>": { url, signature } } }
      - name: Assemble latest.json
        shell: python
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          tag      = os.environ["TAG"]
          repo     = os.environ["REPO"]
          base_url = f"https://github.com/{repo}/releases/download/{tag}"

          platforms = {}
          for meta_file in sorted(Path("artifacts").glob("*.json")):
              try:
                  m = json.loads(meta_file.read_text())
                  if "platform" not in m:
                      continue
                  platforms[m["platform"]] = {
                      "url":       f"{base_url}/{m['bundle']}",
                      "signature": m["signature"],
                  }
                  print(f"  {m['platform']}: {m['bundle']}")
              except Exception as exc:
                  print(f"  SKIP {meta_file.name}: {exc}")

          if not platforms:
              raise RuntimeError("No updater metadata — were TAURI_SIGNING_PRIVATE_KEY secrets configured?")

          latest = {
              "version":  tag.lstrip("v"),
              "notes":    "",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          Path("latest.json").write_text(json.dumps(latest, indent=2))
          print(json.dumps(latest, indent=2))

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "ArchiveTools ${{ github.ref_name }}" \
            --generate-notes \
            --draft

          # Upload installable bundles (skip the .json metadata sidecars)
          find artifacts -type f ! -name "*.json" | sort | \
            xargs -I{} gh release upload "${{ github.ref_name }}" {}

          # Upload latest.json — this is what the Tauri auto-updater endpoint fetches
          gh release upload "${{ github.ref_name }}" latest.json
